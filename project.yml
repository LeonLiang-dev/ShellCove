name: ShellCove

options:
  bundleIdPrefix: dev.leon
  deploymentTarget:
    macOS: "26.0"
  createIntermediateGroups: true
  groupSortPosition: top

settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "20261115"
    DEAD_CODE_STRIPPING: YES
    ENABLE_USER_SCRIPT_SANDBOXING: NO

packages:
  SwiftTerm:
    url: https://github.com/migueldeicaza/SwiftTerm
    from: 1.99.0

targets:
  ShellCove:
    type: application
    platform: macOS
    sources:
      - path: ShellCove
        excludes:
          - Info.plist
          - ShellCove.entitlements
    dependencies:
      - package: SwiftTerm
        product: SwiftTerm
    info:
      path: ShellCove/Info.plist
      properties:
        CFBundleDisplayName: ShellCove
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSMinimumSystemVersion: $(MACOSX_DEPLOYMENT_TARGET)
        LSApplicationCategoryType: public.app-category.developer-tools
        NSHumanReadableCopyright: "© 2026 ShellCove"
        NSHighResolutionCapable: true
        NSSupportsAutomaticTermination: false
        NSSupportsSuddenTermination: false
    entitlements:
      path: ShellCove/ShellCove.entitlements
      properties:
        # 非沙盒：需要执行 /usr/bin/ssh，详见 PRD 9.3
        com.apple.security.app-sandbox: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.leon.shellcove
        PRODUCT_NAME: ShellCove
        GENERATE_INFOPLIST_FILE: NO
        ENABLE_HARDENED_RUNTIME: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        COMBINE_HIDPI_IMAGES: YES

  ShellCoveTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: ShellCoveTests
    dependencies:
      - target: ShellCove
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.leon.shellcove.tests
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: $(BUILT_PRODUCTS_DIR)/ShellCove.app/Contents/MacOS/ShellCove
        BUNDLE_LOADER: $(TEST_HOST)

schemes:
  ShellCove:
    build:
      targets:
        ShellCove: all
        ShellCoveTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - ShellCoveTests
